<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQN オセロ</title>
<style>
  :root { --board: #1b7a43; --line: #0f5a30; --ink: #1f2933; --bg: #f3f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 14px; }
  .bar select, .bar button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #b6c0bb; background: #fff; cursor: pointer; }
  .bar button.primary { background: #1b7a43; color: #fff; border-color: #1b7a43; }
  .scores { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 18px; font-weight: 600; }
  .scores .side { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 8px; border: 2px solid transparent; }
  .scores .side.turn { border-color: #e0a100; background: #fff7dc; }
  .dot { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
  .dot.b { background: #111; } .dot.w { background: #fff; border: 1px solid #888; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; background: var(--line); padding: 2px; border-radius: 6px; width: 100%; aspect-ratio: 1; }
  .cell { background: var(--board); position: relative; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; cursor: default; }
  .cell.legal { cursor: pointer; }
  .cell.legal.mine:hover { background: #249a56; }
  .cell.legal.mine::after { content: ""; width: 22%; height: 22%; border-radius: 50%; background: rgba(0,0,0,.28); }
  .cell .hint { position: absolute; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; pointer-events: none; }
  .disc { width: 82%; height: 82%; border-radius: 50%; box-shadow: 0 2px 3px rgba(0,0,0,.45); transition: background .35s, transform .35s; }
  .disc.b { background: radial-gradient(circle at 35% 30%, #555, #000 70%); }
  .disc.w { background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf 80%); }
  .disc.flip { transform: scale(.85); }
  .cell.last::before { content: ""; position: absolute; inset: 3px; border: 3px solid #e0a100; border-radius: 4px; pointer-events: none; }
  #status { min-height: 24px; margin: 12px 0 6px; font-size: 15px; }
  .eval { margin-top: 8px; font-size: 13px; color: #52606d; }
  .evalbar { height: 10px; background: #111; border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .evalbar > div { height: 100%; background: #fff; width: 50%; transition: width .3s; }
  label.chk { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<main>
  <h1>DQN オセロ</h1>
  <div class="bar">
    <span>あなた:</span>
    <select id="color"><option value="1">黒(先手)</option><option value="-1">白(後手)</option></select>
    <span>AIモデル:</span>
    <select id="model"></select>
    <button class="primary" id="newgame">新しいゲーム</button>
    <label class="chk"><input type="checkbox" id="hint"> ヒント(Q値)</label>
  </div>
  <div class="scores">
    <div class="side" id="sideB"><span class="dot b"></span><span id="scoreB">2</span></div>
    <div class="side" id="sideW"><span class="dot w"></span><span id="scoreW">2</span></div>
  </div>
  <div id="board"></div>
  <div id="status"></div>
  <div class="eval">AIの勝率予想(AI視点の直近の手)
    <div class="evalbar"><div id="evalfill"></div></div>
    <span id="evaltext">-</span>
  </div>
</main>
<script src="othello.js"></script>
<script src="nn.js"></script>
<script src="game.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const cells = [];
  for (let i = 0; i < 64; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.addEventListener('click', () => onCell(i));
    boardEl.appendChild(b);
    cells.push(b);
  }

  let state = null;       // サーバから返った最新状態
  let human = 1;          // 人間の色 1=黒 -1=白
  let busy = false;
  let lastMove = null, lastFlipped = [];
  let gen = 0;            // 新ゲーム時に進行中の処理を無効化する世代番号

  // 学習済みモデルはブラウザ内で読み込み、推論も対局ロジックもすべてクライアント側で動く(サーバ不要)
  const nets = {};
  async function currentNet() {
    const name = $('model').value;
    if (!nets[name]) {
      const r = await fetch('models/' + name + '.json');
      if (!r.ok) throw new Error('モデルを読み込めません: ' + name);
      nets[name] = NN.fromJSON(await r.json());
    }
    return nets[name];
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const name = (p) => (p === 1 ? '黒' : '白');

  function render() {
    const s = state;
    for (let i = 0; i < 64; i++) {
      const el = cells[i];
      const v = s.board[i];
      const myTurn = !s.over && s.player === human && !busy;
      el.className = 'cell' + (s.legal[i] && myTurn ? ' legal mine' : '') + (i === lastMove ? ' last' : '');
      el.innerHTML = '';
      if (v !== 0) {
        const d = document.createElement('div');
        d.className = 'disc ' + (v === 1 ? 'b' : 'w');
        el.appendChild(d);
      } else if (s.legal[i] && !s.over && $('hint').checked) {
        const h = document.createElement('span');
        h.className = 'hint';
        h.textContent = Math.round((s.q[i] + 1) * 50) + '%';
        el.appendChild(h);
      }
    }
    $('scoreB').textContent = s.black;
    $('scoreW').textContent = s.white;
    $('sideB').classList.toggle('turn', !s.over && s.player === 1);
    $('sideW').classList.toggle('turn', !s.over && s.player === -1);
  }

  function setStatus(t) { $('status').textContent = t; }

  function setEval(v) {
    if (v === null || v === undefined) return;
    const pct = (v + 1) * 50;
    $('evalfill').style.width = pct.toFixed(0) + '%';
    $('evaltext').textContent = 'AI勝率 ' + pct.toFixed(0) + '%';
  }

  function finalMessage() {
    const s = state;
    const w = s.winner;
    const score = `黒 ${s.black} - 白 ${s.white}`;
    if (w === 0) return `引き分け(${score})`;
    return (w === human ? 'あなたの勝ち!' : 'AIの勝ち') + `(${score})`;
  }

  // 1手進めて(アニメーション用に flipped を保持)state を更新
  async function applyStep(body, gid) {
    const prevPlayer = state.player;
    const net = await currentNet();
    const res = Game.step(state, body.cell, net);
    if (gid !== gen) return null;
    state = res;
    lastMove = res.move;
    lastFlipped = res.flipped;
    render();
    if (res.value !== null) setEval(res.value);
    return { res, mover: prevPlayer };
  }

  async function aiLoop(gid) {
    while (!state.over && state.player !== human) {
      busy = true; render();
      setStatus(`AI(${name(-human)})が考え中…`);
      await sleep(450);
      if (gid !== gen) return;
      const out = await applyStep({}, gid);
      if (!out) return;
      if (state.over) break;
      if (state.passed) {
        // AIが打った後、人間がパス → もう一度AI
        setStatus(`${name(human)}(あなた)は打てる場所がないためパス`);
        await sleep(900);
      }
    }
    busy = false; render();
    if (state.over) setStatus(finalMessage());
    else setStatus(`あなた(${name(human)})の番です`);
  }

  async function onCell(i) {
    if (busy || !state || state.over || state.player !== human || !state.legal[i]) return;
    const gid = gen;
    try {
      busy = true;
      const out = await applyStep({ cell: i }, gid);
      if (!out) return;
      busy = false;
      if (state.over) { render(); setStatus(finalMessage()); return; }
      if (state.passed) {
        // 人間が打った後、AIがパス → 続けて人間の番
        render();
        setStatus(`AI(${name(-human)})は打てる場所がないためパス。もう一度あなたの番です`);
        return;
      }
      await aiLoop(gid);
    } catch (e) {
      busy = false; render(); setStatus('エラー: ' + e.message);
    }
  }

  async function newGame() {
    const gid = ++gen;
    human = parseInt($('color').value, 10);
    busy = false; lastMove = null; lastFlipped = [];
    $('evalfill').style.width = '50%'; $('evaltext').textContent = '-';
    try {
      state = Game.newGame(await currentNet());
      if (gid !== gen) return;
      render();
      if (state.player !== human) await aiLoop(gid);
      else setStatus(`あなた(${name(human)})の番です`);
    } catch (e) {
      setStatus('エラー: ' + e.message);
    }
  }

  async function init() {
    const models = await (await fetch('models/index.json')).json();
    const labels = { final: '最終モデル', best: 'ベストモデル', latest: '最新チェックポイント' };
    for (const m of models) {
      const o = document.createElement('option');
      o.value = m; o.textContent = labels[m] || m;
      $('model').appendChild(o);
    }
    $('newgame').addEventListener('click', newGame);
    $('color').addEventListener('change', newGame);
    $('model').addEventListener('change', () => { if (state) { render(); } });
    $('hint').addEventListener('change', () => { if (state) render(); });
    newGame();
  }
  init();
})();
</script>
</body>
</html>
